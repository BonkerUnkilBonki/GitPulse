org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# Sandbox egress proxy (remove these lines when building outside this sandbox)
systemProp.http.proxyHost=egress-proxy.sandbox.internal
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=egress-proxy.sandbox.internal
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.0.0.1
