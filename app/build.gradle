plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

android {
    namespace 'com.codenamezeroseven.gitpulse'
    compileSdk 35

    defaultConfig {
        applicationId "com.codenamezeroseven.gitpulse"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "1.7"
    }

    signingConfigs {
        // Persistent key so every build installs over previous ones, even if
        // the build machine is rebuilt. Kept at project root and shipped in
        // the source zip - do not lose it.
        gitpulse {
            storeFile file("../gitpulse.keystore")
            storePassword "gitpulse2024"
            keyAlias "gitpulse"
            keyPassword "gitpulse2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.gitpulse
        }
        debug {
            signingConfig signingConfigs.gitpulse
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
